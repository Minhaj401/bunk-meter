<!DOCTYPE html>
<html>
<head>
  <title>BunkMaster | Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-container">
    <div style="text-align: center; margin-bottom: 30px;">
      <h1 style="font-size: 32px; font-weight: 700; margin-bottom: 5px; color: var(--primary-light);">BUNK<span style="color: var(--secondary);">MASTER</span></h1>
      <p style="opacity: 0.7; font-size: 14px;">Track your attendance like a boss</p>
    </div>
    
    <form method="POST" style="margin-top: 20px;">
      <div style="margin-bottom: 20px;">
        <label style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500;">UNIVERSITY ID</label>
        <div style="position: relative; display: flex; justify-content: center;">
          <input type="text" name="username" placeholder="Enter your ID" required>
        </div>
      </div>
      
      <div style="margin-bottom: 25px;">
        <label style="display: block; margin-bottom: 8px; font-size: 14px; font-weight: 500;">PASSWORD</label>
        <div style="position: relative; display: flex; justify-content: center;">
          <input type="password" name="password" placeholder="Enter your password" required>
        </div>
      </div>
      
      <div style="display: flex; justify-content: center;">
        <button type="submit">
          LOG IN
        </button>
      </div>
    </form>
    
    <div style="text-align: center; margin-top: 25px; font-size: 13px; opacity: 0.6;">
      <p>Know exactly when you can skip class</p>
    </div>
  </div>
  

</body>
</html>
